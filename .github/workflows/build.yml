name: Compile Windows Executable

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
    - name: Checkout repository code
      uses: actions/checkout@v4

    - name: Set up Python Environment
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'
        cache: 'pip'

    - name: Install Project Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pyinstaller

    - name: Compile Application to Standalone EXE
      run: |
        pyinstaller --onefile --noconsole --noconfirm --name="CIMS" --add-data "ui;ui" --add-data "sample_data;sample_data" app.py

    - name: Archive Executable Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: CIMS-Windows-Executable
        path: dist/CIMS.exe
        retention-days: 7
